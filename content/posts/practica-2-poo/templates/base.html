<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Estacionamiento{% endblock %}</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        nav { background-color: #2c3e50; padding: 15px; border-radius: 6px; margin-bottom: 20px; display: flex; gap: 15px; }
        nav a { color: white; text-transform: uppercase; text-decoration: none; font-weight: bold; font-size: 0.9em; }
        nav a:hover { color: #1abc9c; }
        .container { max-width: 800px; margin: auto; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .alert-success { background-color: #d4edda; color: #155724; padding: 12px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #c3e6cb; }
        .alert-danger { background-color: #f8d7da; color: #721c24; padding: 12px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #f5c6cb; }
        input, select, button { padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
        button { background-color: #1abc9c; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #16a085; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="{{ url_for('dashboard') }}">📊 Dashboard</a>
            <a href="{{ url_for('entry') }}">📥 Registrar Entrada</a>
            <a href="{{ url_for('exit') }}">📤 Registrar Salida</a>
        </nav>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
